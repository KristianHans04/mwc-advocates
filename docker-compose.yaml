version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      PORT: "80"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}

      EMAIL_FROM: ${EMAIL_FROM:-noreply@mwc-advocates.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mwc-advocates.com}

      ZOHO_SMTP_HOST: ${ZOHO_SMTP_HOST:-smtp.zoho.com}
      ZOHO_SMTP_PORT: ${ZOHO_SMTP_PORT:-587}
      ZOHO_SMTP_USER: ${ZOHO_SMTP_USER}
      ZOHO_SMTP_PASS: ${ZOHO_SMTP_PASS}

      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY}

      JWT_SECRET: ${JWT_SECRET}

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mwc-advocates-web.rule=Host(`${SERVICE_FQDN_WEB}`) || Host(`${COOLIFY_FQDN}`)"
      - "traefik.http.routers.mwc-advocates-web.entrypoints=https"
      - "traefik.http.routers.mwc-advocates-web.tls=true"
      - "traefik.http.routers.mwc-advocates-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.mwc-advocates-web.loadbalancer.server.port=80"

      - "traefik.http.middlewares.mwc-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.mwc-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.mwc-advocates-web-http.rule=Host(`${SERVICE_FQDN_WEB}`) || Host(`${COOLIFY_FQDN}`)"
      - "traefik.http.routers.mwc-advocates-web-http.entrypoints=http"
      - "traefik.http.routers.mwc-advocates-web-http.middlewares=mwc-https-redirect"

    networks:
      - coolify

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  coolify:
    external: true
    name: coolify
